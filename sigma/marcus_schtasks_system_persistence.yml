title: Scheduled Task Created To Run As SYSTEM With High-Frequency Trigger
id: 8f1c5a2e-4d3b-4a17-9c62-1b7e0a5d3f41
status: experimental
description: |
    Detects the creation of a scheduled task, via schtasks.exe, that runs as the SYSTEM
    account with a high-frequency or startup trigger (minute, onstart, onlogon).

    Each element on its own is legitimate. It is the combination -- highest privilege plus
    persistent re-execution -- that rarely appears in normal administration and often appears
    in remote execution and in persistence.

    Written from first-hand observation of the public sample
    "ID4688-4698 Persistent scheduled task with SYSTEM privileges creation.evtx"
    (mdecrevoisier/EVTX-to-MITRE-Attack, CC0).
references:
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-create
    - https://attack.mitre.org/techniques/T1053/005/
author: Marcus Paula
date: 2026-09-07
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - ' /create '
            - ' /ru '
    selection_system_account:
        CommandLine|contains:
            - ' /ru SYSTEM'
            - ' /ru "SYSTEM"'
            - ' /ru NT AUTHORITY\SYSTEM'
            - ' /ru "NT AUTHORITY\SYSTEM"'
    selection_frequent_trigger:
        CommandLine|contains:
            - ' /sc minute'
            - ' /sc onstart'
            - ' /sc onlogon'
    filter_installer_parent:
        ParentImage|startswith:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
    condition: all of selection_* and not filter_installer_parent
falsepositives:
    - Software installers that create maintenance tasks running as SYSTEM. The ParentImage
      filter covers some of these cases, but only when the field is present.
    - Configuration-management tools (SCCM, Intune, Ansible) that legitimately create SYSTEM
      tasks. They should be filtered by ParentImage in a specific organisation.
    - Internal administration scripts. An environment with its own automation can produce
      this routinely -- which is why the level is not high.
level: medium
