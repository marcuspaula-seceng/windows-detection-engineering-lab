title: Scheduled Task Registered To Run As SYSTEM With Persistent Trigger
id: 3d7a91c6-08fe-4b52-b1d4-6e2c9f04a8b3
status: experimental
description: |
    Detects, in audit event 4698 ("a scheduled task was created"), the registration of a
    task whose principal is the SYSTEM account and whose trigger is persistent -- a repetition
    of a few minutes, machine startup, or logon.

    It complements, and does not replace, the process_creation rule. The process rule sees HOW
    the task was created (schtasks.exe). This one sees THAT the task was created, and catches
    the case where creation goes through Register-ScheduledTask or the Task Scheduler API
    without ever launching schtasks.exe.

    Every pattern searched for was read from the real TaskContent of the public sample
    "ID4688-4698 Persistent scheduled task with SYSTEM privileges creation.evtx"
    (mdecrevoisier/EVTX-to-MITRE-Attack, CC0), except BootTrigger and LogonTrigger, which are
    the documented equivalents of /sc onstart and /sc onlogon in the Task Scheduler schema.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4698
    - https://learn.microsoft.com/en-us/windows/win32/taskschd/task-scheduler-schema
    - https://attack.mitre.org/techniques/T1053/005/
author: Marcus Paula
date: 2026-09-07
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    product: windows
    service: security
    definition: 'Requires "Audit Other Object Access Events" to be enabled. Without it, no 4698 is written and this rule is silent.'
detection:
    selection_event:
        EventID: 4698
    selection_system_principal:
        TaskContent|contains:
            - '<UserId>S-1-5-18</UserId>'
            - '<UserId>NT AUTHORITY\SYSTEM</UserId>'
            - '<UserId>SYSTEM</UserId>'
    selection_persistent_trigger:
        TaskContent|contains:
            - '<Interval>PT1M</Interval>'
            - '<Interval>PT2M</Interval>'
            - '<Interval>PT3M</Interval>'
            - '<Interval>PT5M</Interval>'
            - '<BootTrigger>'
            - '<LogonTrigger>'
    filter_windows_own_tasks:
        TaskName|startswith: '\Microsoft\'
    condition: all of selection_* and not filter_windows_own_tasks
falsepositives:
    - Monitoring and configuration-management agents (SCCM, Intune, Ansible, backup tools)
      that register SYSTEM tasks with a startup trigger. They are the main source of noise
      for this rule and should be filtered by TaskName in a specific organisation.
    - Software installers that register update tasks running at startup.
    - Internal maintenance tasks created by an organisation's own automation.
level: medium
